version: "1.0"
namespace: app

# Standalone harness for windows/antibug. Provides the host resources the boot
# needs (app:db, app:processes, a gateway and a router for the shell's
# endpoints, env storage, a permissive actor scope, the fonts and the shots
# folder), the probes, fixtures and the Go target AntiBug's suites use, and
# runs the co-located *_test.lua suites. Excluded from publish by the module's
# wippy.yaml.
#
# Every test entry is a function.lua with `meta.type: test`; `wippy test`
# runs the ones it discovers. A test file must be in the run_cases form — the
# other form is counted, printed green and never executed.

entries:
  - name: definition
    kind: ns.definition
    meta: {title: AntiBug Test Harness}

  # ─── The window's entry ───────────────────────────────────────────────
  # Also the real harness entry antibug_test's live case scans through the
  # runner: small, clean and in this harness.
  - name: window_test
    kind: function.lua
    meta:
      type: test
      comment: "AntiBug's entry — the Start menu fields, Find's picture, requires windows.admin, and the trust shape (the window calls only the runner, the runner has its own actor and the wide policy)."
      group: AntiBug
      suite: windows_antibug
    source: file://window_test.lua
    method: run
    # Reading a picture takes `registry.get` as well as `fs.get`, and `gfx` to
    # decode it.
    modules: [gfx, fs, registry]
    imports:
      test: wippy.test:test
      images: windows.shell.theme:images

  # ─── AntiBug §3: does a funcs call honour the callee's declared actor? ───
  # A probe with its own `security` block and the same probe without one; the
  # test calls them as itself and as a narrow caller it builds, and reads who
  # they ran as and what they could do.
  - name: antibug_probe_grant
    kind: security.policy
    meta:
      comment: The one grant of the AntiBug actor probe, an action nobody else is given.
    policy:
      actions:
        - antibug.probe
      resources: "*"
      effect: allow

  - name: antibug_narrow_grant
    kind: security.policy
    meta:
      comment: The narrow caller the test builds may only call the two probes.
    policy:
      actions:
        - funcs.call
      resources:
        - app:antibug_actor_probe
        - app:antibug_actor_plain
      effect: allow

  - name: antibug_actor_probe
    kind: function.lua
    meta:
      comment: Reports its actor and whether it may probe — a function entry with its own declared actor and policy.
    source: file://antibug_actor_probe.lua
    method: run
    modules: [security]
    security:
      actor:
        id: app:antibug_actor_probe
      policies:
        - app:antibug_probe_grant

  # The control: the same probe without a `security` block.
  - name: antibug_actor_plain
    kind: function.lua
    meta:
      comment: The AntiBug actor probe without a security block of its own — the control of the measurement.
    source: file://antibug_actor_probe.lua
    method: run
    modules: [security]

  - name: antibug_actor_test
    kind: function.lua
    meta:
      type: test
      group: AntiBug
      suite: windows_antibug
      comment: AntiBug §3 — a funcs call runs the callee under the actor its entry declares, its declared policies added to the caller's scope; measured as the runner and as a narrow caller, against a probe without a security block.
    source: file://antibug_actor_test.lua
    method: run
    modules: [security, funcs]
    imports:
      test: wippy.test:test

  - name: antibug_test
    kind: function.lua
    meta:
      type: test
      group: AntiBug
      suite: windows_antibug
      comment: AntiBug §6 — the model on fake events, every menu item and button, the close gate, Save…, the layout in both modes, a live scan of a real harness entry through the real runner, and test/shots/antibug.png and antibug-complete.png.
    source: file://antibug_test.lua
    method: run
    modules: [channel, time, fs, gfx, funcs]
    imports:
      test: wippy.test:test
      ui: windows.shell.sdk:ui
      app: windows.shell.sdk:app
      render: windows.shell.sdk:render
      rasters: windows.shell.theme:rasters
      scan: windows.antibug:scan
      antibug_window: windows.antibug:window

  # AntiBug §4a: output captured from the real tools, and a Go module scanned
  # as a `go` target by the live case.
  - name: antibug_fixtures
    kind: fs.directory
    meta:
      comment: AntiBug's captured runner output (wippy.txt, go.jsonl) and the Go module of its live target.
    base: project
    directory: ./fixtures/antibug
    auto_init: false

  # A target declared the way an application declares one; the directory is
  # relative to the runtime's working directory, test/, where `wippy test` runs.
  - name: antibug_go_target
    kind: registry.entry
    meta:
      type: windows.antibug_target
      title: AntiBug fixture (Go)
      kind: go
      dir: fixtures/antibug/gomod
      order: 1
      # exec.native gives the child nothing of the runtime's environment:
      # go needs PATH, and a HOME or its cache directories.
      env:
        HOME: /tmp/antibug-go-home
        GOCACHE: /tmp/antibug-gocache
        GOPATH: /tmp/antibug-gopath
        PATH: /usr/local/go/bin:/snap/bin:/usr/local/bin:/usr/bin:/bin
      comment: A tiny Go module with a pass, a failure and a skip, for the live scan of a go target.

  - name: antibug_targets_test
    kind: function.lua
    meta:
      type: test
      group: AntiBug
      suite: windows_antibug
      comment: AntiBug §4a — the wippy runner and go test -json parsers on captured output, the declarations and commands, a target's state machine in the model and the window, and a live Go target through the real runner, target process and exec.
    source: file://antibug_targets_test.lua
    method: run
    modules: [channel, time, fs]
    imports:
      test: wippy.test:test
      app: windows.shell.sdk:app
      scan: windows.antibug:scan
      targets: windows.antibug:targets
      antibug_window: windows.antibug:window

  # ─── Host resources ───────────────────────────────────────────────────
  - name: shots
    kind: fs.directory
    meta:
      comment: Where the window's shots go.
    base: project
    directory: ./shots
    auto_init: true

  - name: system_fonts
    kind: fs.directory
    meta:
      comment: System TrueType fonts, read-only — the font arrives in gfx as bytes, not as a path.
    auto_init: false
    directory: /usr/share/fonts/truetype/liberation/

  - name: db
    kind: db.sql.sqlite
    meta:
      comment: In-memory database — AntiBug does not use it, but the shell's migrations ask for the resource.
    file: ":memory:"

  - name: env_storage
    kind: env.storage.file
    meta:
      type: envstorage
    file_path: ./.wippy/test.env
    auto_create: true

  - name: processes
    kind: process.host
    lifecycle:
      auto_start: true

  # The shell's endpoint entries resolve against these at boot; no suite calls
  # them. The port is apart from the shell harness's :19229 and the other
  # modules' harnesses, so they can run side by side.
  - name: gateway
    kind: http.service
    addr: :19243
    lifecycle:
      auto_start: true

  - name: api
    kind: http.router
    meta:
      server: gateway
    prefix: /api

  - name: user
    kind: security.policy
    meta:
      comment: Permissive actor scope for the suites.
    policy:
      resources: '*'
      actions: '*'
      effect: allow

  # The harness tests the module, so it depends on it; the replacement in
  # .wippy.yaml substitutes the working copy from ../.
  - name: antibug_harness.dep.module
    version: "*"
    kind: ns.dependency
    meta:
      comment: The module under test; its source is replaced with ../ in .wippy.yaml.
    component: "windows/antibug"

  - name: antibug_harness.dep.migration
    version: "*"
    kind: ns.dependency
    meta:
      comment: Host binding for the migrations the shell brings.
    component: "wippy/migration"
    parameters:
      - name: wippy.migration:app_db
        value: app:db

  - name: antibug_harness.dep.security
    version: "*"
    kind: ns.dependency
    meta:
      comment: Platform security groups that give host-managed services their policy scope under strict mode.
    component: "wippy/security"

  - name: antibug_harness.dep.bootloader
    version: "*"
    kind: ns.dependency
    meta:
      comment: Host wiring for the standalone test harness.
    component: "wippy/bootloader"
    parameters:
      - name: wippy.bootloader:application_host
        value: app:processes
      - name: wippy.bootloader:env_storage
        value: app:env_storage
